# Sample workflow for building and deploying a Hugo site to UW
name: Deploy Hugo site to UW

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "uw"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.9.6
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
            pixi run build \
            "--baseURL https://staff.washington.edu/${{ secrets.UWUSER }}/"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uw-pages
          path: ./public

  # Deploy to UW 
  uw:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v8
        with:
          name: uw-pages
          path: public_html
      - name: Deploy to UW Web Servers
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.UWHOST }}
          username: ${{ secrets.UWUSER }}
          password: ${{ secrets.UWPASS }}
          port: ${{ secrets.PORT }}
          source: "public_html/*"
          target: ./
          overwrite: true
