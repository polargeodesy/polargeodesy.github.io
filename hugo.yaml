# Hugo configuration file
baseURL: https://polargeodesy.github.io/
languageCode: en-us
title: Geodesy Lab at the UW-APL Polar Science Center
enableGitInfo: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [html]
  page: [html]
  section: [html]

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: People
      pageRef: /people
      weight: 1
    - name: Research
      pageRef: /research
      weight: 2
    - name: Publications
      pageRef: /publications
      weight: 3
    - name: Contact
      pageRef: /contact
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/polargeodesy"
      params:
        icon: github

  sidebar:
    - name: "UW Applied Physics Laboratory"
      url: "https://apl.uw.edu/"
      weight: 1
    - name: "UW-APL Polar Science Center"
      url: "https://psc.apl.uw.edu/"
      weight: 2

params:
  description: >
    Polar Geodesy Lab at the University of Washington Applied Physics Laboratory

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /images/polargeodesy.png
      link: /
      width: 60

  theme:
    default: light
    displayToggle: false

  page:
    width: normal

  footer:
    enable: true
    width: normal
    displayCopyright: true
    displayPoweredBy: true

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content

  highlight:
    copy:
      enable: true
      display: hover

  comments:
    enable: false

  editURL:
    enable: true
    base: "https://github.com/polargeodesy/polargeodesy.github.io/edit/main/content"

