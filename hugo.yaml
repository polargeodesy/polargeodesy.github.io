# Hugo configuration file
title: Geodesy Lab at the UW-APL Polar Science Center

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/polargeodesy"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/polargeodesy/polargeodesy.github.io"
      params:
        icon: github

params:
  description: Homepage for the Geodesy Laboratory at the UW-APL Polar Science Center.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /images/polargeodesy.png
      link: /
      width: 60

  theme:
    default: light
    displayToggle: false

  footer:
    enable: true
    width: normal
    displayCopyright: true
    displayPoweredBy: true

  highlight:
    copy:
      enable: true
      display: hover

  comments:
    enable: false

  editURL:
    enable: false
